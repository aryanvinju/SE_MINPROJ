name: TriadLens CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify JavaScript syntax
        run: node --check static/app.js
      - name: Run public data-free checks
        run: python -m pytest -q tests/test_public.py
  container:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build application image
        run: docker build -t triadlens:${{ github.sha }} .
      - name: Confirm private artifacts are absent
        run: |
          docker run --rm --entrypoint sh triadlens:${{ github.sha }} -c \
            'test ! -f /app/models/qml.joblib && test ! -f /app/data/lungcancer.csv && test ! -f /app/reports/metrics.json'
  publish:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: [test, container]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Docker Hub destination and credentials
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_TOKEN" ]]; then
            echo 'Configure DOCKERHUB_USERNAME and DOCKERHUB_TOKEN repository secrets.' >&2
            exit 1
          fi
          if [[ "$DOCKERHUB_USERNAME" != 'aryanvinju' ]]; then
            echo 'DOCKERHUB_USERNAME must be aryanvinju for this repository.' >&2
            exit 1
          fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish source-only image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            aryanvinju/se_miniproj:${{ github.sha }}
            aryanvinju/se_miniproj:latest
